[project]
name = "second-reader"
version = "0.1.0"
description = "QA layer that grades human-produced AI training data, flags suspect submissions, and routes low-confidence cases to human review."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "duckdb>=1.0",
    "polars>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_reader"]
