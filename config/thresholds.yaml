# Routing thresholds operate on the acceptance score in [0, 1]:
#   score = confidence            if verdict == accept
#   score = 1 - confidence        if verdict == reject
# then pulled toward 0.5 when the order-swap verdict flipped:
#   score = 0.5 + (score - 0.5) * (1 - flip_penalty)
#
# score >= high  -> auto-accept
# score <= low   -> auto-reject (FLAGGED)
# otherwise      -> human review queue (THRESHOLD_ROUTED)
# An agent flag_for_review call overrides everything -> human review (AGENT_ESCALATED)
routing:
  high: 0.75
  low: 0.35
  flip_penalty: 0.6

# Agent loop control.
agent:
  max_tool_calls: 6        # evidence-gathering calls per item; then verdict is forced
  truncate_chars: 200      # responses are truncated to this in the starting context
  history_limit: 10        # rows returned by get_annotator_history

# Adversarial verifier (third ablation arm). Runs on top of the agent arm's
# verdicts: uphold -> verdict stands, confidence = mean(grader, verifier);
# overturn -> verdict flips, confidence = verifier_conf * (1 - overturn_penalty)
# so overturns land near the review band unless the verifier is very sure.
verifier:
  max_tool_calls: 3
  overturn_penalty: 0.4

# Layer 0: deterministic annotator-level aggregates, computed from the
# submissions table alone (no model calls, no ground truth). An annotator is
# flagged when, over at least min_items submissions:
#   side_ratio >= side_ratio_flag   (share of votes on their most-voted side)
#   dup_ratio  >= dup_ratio_flag    (share of items sharing their most-reused
#                                    justification, exact match after
#                                    whitespace normalization)
# A flagged annotator's items are all routed to auto-reject.
aggregates:
  min_items: 8
  side_ratio_flag: 0.95
  dup_ratio_flag: 0.5

# Calibration sweep grid. Every (high, low) pair with high > low is evaluated.
sweep:
  high: [0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
  low: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]

model: claude-sonnet-4-5
# USD per million tokens (input, output) used for logged cost.
pricing:
  claude-sonnet-4-5:
    input: 3.0
    output: 15.0
